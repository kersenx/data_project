<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'PingFang SC','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="gClient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="gMaster" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="gTM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowBoth" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,3 L8,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="640" rx="18" fill="url(#bg)"/>
  <text x="450" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Flink 整体架构</text>

  <!-- edges (drawn first, under nodes) -->
  <g fill="none" stroke="#94a3b8" stroke-width="2">
    <path d="M450,130 L450,196" marker-end="url(#arrow)"/>
    <path d="M540,278 L588,278" marker-end="url(#arrow)"/>
    <path d="M450,326 C450,360 300,372 300,406" marker-end="url(#arrow)"/>
    <path d="M460,326 C500,372 620,372 620,406" marker-end="url(#arrow)"/>
  </g>
  <!-- bidirectional: JobMaster <-> ResourceManager (already one arrow above, add reverse head) -->
  <path d="M588,288 L540,288" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- TM1 <-> TM2 shuffle -->
  <path d="M408,520 L492,520" fill="none" stroke="#94a3b8" stroke-width="2" marker-start="url(#arrowBoth)" marker-end="url(#arrow)"/>

  <!-- edge labels -->
  <g font-size="13" fill="#475569">
    <rect x="392" y="150" width="116" height="22" rx="11" fill="#fff" stroke="#e2e8f0"/>
    <text x="450" y="165" text-anchor="middle">提交 JobGraph</text>
    <rect x="520" y="252" width="88" height="20" rx="10" fill="#fff" stroke="#e2e8f0"/>
    <text x="564" y="266" text-anchor="middle" font-size="12">资源申请</text>
    <rect x="240" y="360" width="178" height="22" rx="11" fill="#fff" stroke="#e2e8f0"/>
    <text x="329" y="375" text-anchor="middle" font-size="12">部署 Task / 触发 Checkpoint</text>
    <rect x="404" y="498" width="92" height="20" rx="10" fill="#fff" stroke="#e2e8f0"/>
    <text x="450" y="512" text-anchor="middle" font-size="12">数据 shuffle</text>
  </g>

  <!-- Client -->
  <g filter="url(#shadow)">
    <rect x="330" y="78" width="240" height="52" rx="12" fill="url(#gClient)"/>
  </g>
  <text x="450" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Client（提交端）</text>
  <text x="450" y="119" text-anchor="middle" font-size="12.5" fill="#cbd5e1">生成 JobGraph 并提交</text>

  <!-- JobManager group -->
  <rect x="120" y="196" width="660" height="130" rx="16" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="138" y="218" font-size="14" font-weight="700" fill="#7c3aed">JobManager（主）</text>

  <g filter="url(#shadow)">
    <rect x="150" y="238" width="190" height="70" rx="12" fill="url(#gCard)" stroke="#e2e8f0"/>
    <rect x="588" y="238" width="190" height="70" rx="12" fill="url(#gCard)" stroke="#e2e8f0"/>
    <rect x="369" y="238" width="190" height="70" rx="12" fill="url(#gMaster)"/>
  </g>
  <text x="245" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Dispatcher</text>
  <text x="245" y="290" text-anchor="middle" font-size="12" fill="#64748b">REST / 作业提交</text>
  <text x="464" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">JobMaster</text>
  <text x="464" y="288" text-anchor="middle" font-size="11.5" fill="#ede9fe">调度 + Checkpoint 协调</text>
  <text x="683" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">ResourceManager</text>
  <text x="683" y="290" text-anchor="middle" font-size="12" fill="#64748b">资源申请 YARN/K8s</text>

  <!-- TaskManager group -->
  <rect x="120" y="406" width="660" height="196" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="138" y="428" font-size="14" font-weight="700" fill="#2563eb">TaskManager（工作节点）</text>

  <!-- TM1 -->
  <g filter="url(#shadow)"><rect x="170" y="442" width="238" height="142" rx="14" fill="url(#gTM)"/></g>
  <text x="289" y="470" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">TaskManager 1</text>
  <g fill="#1e40af">
    <rect x="186" y="486" width="66" height="80" rx="9" fill="#dbeafe"/>
    <rect x="256" y="486" width="66" height="80" rx="9" fill="#dbeafe"/>
    <rect x="326" y="486" width="66" height="80" rx="9" fill="#dbeafe"/>
  </g>
  <g font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">
    <text x="219" y="531">Slot</text><text x="289" y="531">Slot</text><text x="359" y="531">Slot</text>
  </g>

  <!-- TM2 -->
  <g filter="url(#shadow)"><rect x="492" y="442" width="238" height="142" rx="14" fill="url(#gTM)"/></g>
  <text x="611" y="470" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">TaskManager 2</text>
  <g>
    <rect x="508" y="486" width="66" height="80" rx="9" fill="#dbeafe"/>
    <rect x="578" y="486" width="66" height="80" rx="9" fill="#dbeafe"/>
    <rect x="648" y="486" width="66" height="80" rx="9" fill="#dbeafe"/>
  </g>
  <g font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">
    <text x="541" y="531">Slot</text><text x="611" y="531">Slot</text><text x="681" y="531">Slot</text>
  </g>
</svg>
